# Project identification
sonar.projectKey=romeo-codeit-real-estate
sonar.projectName=Real Estate Platform
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/__tests__/**,**/*.test.ts,**/*.spec.ts,**/dist/**,**/.next/**

# Test code location
sonar.tests=src/tests,src/services/supabase/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Language and Encoding
sonar.sourceEncoding=UTF-8
sonar.javascript.environments=node,browser

# Quality Gate and Analysis
sonar.qualitygate.wait=true

# Coverage (requires Vitest to generate LCOV report)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
